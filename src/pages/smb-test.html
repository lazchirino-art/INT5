<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prueba - Detector SMB</title>
  <link rel="stylesheet" href="/src/styles/main.css" />
  <style>
    .smb-container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .smb-form {
      background: rgba(31, 91, 255, 0.05);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--color-text);
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--color-text);
      font-size: 14px;
    }

    .form-group input::placeholder {
      color: var(--color-text-secondary);
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .btn-primary {
      background: linear-gradient(180deg, var(--color-primary), var(--color-primary-dark));
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--color-text);
      border: 1px solid var(--color-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .result-container {
      margin-top: 24px;
    }

    .result-box {
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .result-success {
      background-color: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
    }

    .result-error {
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }

    .result-info {
      background-color: rgba(31, 91, 255, 0.1);
      border: 1px solid rgba(31, 91, 255, 0.3);
      color: #1f5bff;
    }

    .result-title {
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 16px;
    }

    .result-content {
      font-size: 14px;
      line-height: 1.5;
    }

    .logs-container {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 16px;
      max-height: 400px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }

    .log-entry {
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .log-info {
      color: #1f5bff;
    }

    .log-success {
      color: #10b981;
    }

    .log-error {
      color: #ef4444;
    }

    .log-warning {
      color: #f59e0b;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
    }

    .status-ready {
      background-color: #10b981;
      color: white;
    }

    .status-failed {
      background-color: #ef4444;
      color: white;
    }

    .status-processing {
      background-color: #f59e0b;
      color: white;
    }

    .file-list {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 12px;
      margin-top: 12px;
    }

    .file-item {
      padding: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 13px;
    }

    .file-item:last-child {
      border-bottom: none;
    }

    .loading {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: var(--color-text-secondary);
      margin-bottom: 32px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="smb-container">
    <h1>🔍 Detector SMB - Prueba</h1>
    <p class="subtitle">Acceso a rutas de red compartidas (SMB) y detección de archivos CSV</p>

    <!-- Formulario -->
    <div class="smb-form">
      <form id="smbForm">
        <div class="form-group">
          <label for="networkPath">Ruta de Red (UNC)</label>
          <input 
            type="text" 
            id="networkPath" 
            placeholder="\\servidor\compartida\datos"
            required
          />
          <small style="color: var(--color-text-secondary); display: block; margin-top: 4px;">
            Formato: \\servidor\compartida\carpeta
          </small>
        </div>

        <div class="form-group">
          <label for="username">Usuario</label>
          <input 
            type="text" 
            id="username" 
            placeholder="nombre_usuario"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            placeholder="contraseña"
            required
          />
        </div>

        <div class="form-group">
          <label for="domain">Dominio (Opcional)</label>
          <input 
            type="text" 
            id="domain" 
            placeholder="DOMINIO"
          />
        </div>

        <div class="form-group">
          <label for="filePattern">Patrón de Archivo</label>
          <input 
            type="text" 
            id="filePattern" 
            placeholder="datos_*.csv"
            required
          />
          <small style="color: var(--color-text-secondary); display: block; margin-top: 4px;">
            Soporta wildcards: * (ej: datos_*.csv, *.csv, reporte.csv)
          </small>
        </div>

        <div class="button-group">
          <button type="button" class="btn btn-primary" onclick="handleDetect()">
            Detectar Archivo
          </button>
          <button type="button" class="btn btn-secondary" onclick="handleVerify()">
            Verificar Conexión
          </button>
          <button type="button" class="btn btn-secondary" onclick="handleListFiles()">
            Listar Archivos
          </button>
        </div>
      </form>
    </div>

    <!-- Resultado -->
    <div class="result-container" id="resultContainer" style="display: none;">
      <div id="resultBox"></div>
    </div>

    <!-- Logs -->
    <div class="result-container" id="logsContainer" style="display: none;">
      <h3 style="margin-bottom: 12px;">📋 Logs Detallados</h3>
      <div class="logs-container" id="logsList"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/src/js/smb-client.js"></script>
  <script>
    // Crear cliente global
    const smbClient = new SMBClient();

    /**
     * Obtener datos del formulario
     */
    function getFormData() {
      return {
        path: document.getElementById('networkPath').value,
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
        domain: document.getElementById('domain').value || undefined,
        pattern: document.getElementById('filePattern').value
      };
    }

    /**
     * Mostrar resultado
     */
    function displayResult(result) {
      const resultContainer = document.getElementById('resultContainer');
      const resultBox = document.getElementById('resultBox');

      if (result.status === 'READY') {
        resultBox.innerHTML = `
          <div class="result-box result-success">
            <div class="result-title">✔ Éxito</div>
            <div class="result-content">
              <strong>Archivo seleccionado:</strong><br>
              ${result.selectedFile || 'N/A'}
              <span class="status-badge status-ready">READY</span>
            </div>
          </div>
        `;
      } else if (result.status === 'FAILED') {
        let errorDetails = result.message || 'Error desconocido';
        if (result.files && result.files.length > 0) {
          errorDetails += `<br><strong>Archivos encontrados:</strong><br>${result.files.join('<br>')}`;
        }
        resultBox.innerHTML = `
          <div class="result-box result-error">
            <div class="result-title">❌ Error</div>
            <div class="result-content">
              ${errorDetails}
              <span class="status-badge status-failed">FAILED</span>
            </div>
          </div>
        `;
      } else {
        resultBox.innerHTML = `
          <div class="result-box result-info">
            <div class="result-title">ℹ Estado</div>
            <div class="result-content">
              ${result.message || result.status}
              <span class="status-badge status-processing">PROCESSING</span>
            </div>
          </div>
        `;
      }

      resultContainer.style.display = 'block';
    }

    /**
     * Mostrar logs
     */
    function displayLogs(logs) {
      const logsContainer = document.getElementById('logsContainer');
      const logsList = document.getElementById('logsList');

      if (!logs || logs.length === 0) {
        logsContainer.style.display = 'none';
        return;
      }

      logsList.innerHTML = logs
        .map(log => `
          <div class="log-entry log-${log.type}">
            [${log.timestamp}] ${log.prefix}
          </div>
        `)
        .join('');

      logsContainer.style.display = 'block';
    }

    /**
     * Detectar archivo
     */
    async function handleDetect() {
      const formData = getFormData();
      
      if (!formData.path || !formData.username || !formData.password || !formData.pattern) {
        alert('Por favor completa todos los campos requeridos');
        return;
      }

      const result = await smbClient.detect(formData);
      displayResult(result);
      displayLogs(result.logs);
    }

    /**
     * Verificar conexión
     */
    async function handleVerify() {
      const formData = getFormData();
      
      if (!formData.path || !formData.username || !formData.password) {
        alert('Por favor completa los campos requeridos');
        return;
      }

      const result = await smbClient.verify(formData);
      displayResult(result);
      displayLogs(result.logs);
    }

    /**
     * Listar archivos
     */
    async function handleListFiles() {
      const formData = getFormData();
      
      if (!formData.path || !formData.username || !formData.password) {
        alert('Por favor completa los campos requeridos');
        return;
      }

      const result = await smbClient.listFiles(formData);
      
      if (result.status === 'READY' && result.files) {
        const resultBox = document.getElementById('resultBox');
        resultBox.innerHTML = `
          <div class="result-box result-success">
            <div class="result-title">✔ Archivos Listados</div>
            <div class="result-content">
              Total: ${result.files.length} archivos
              <div class="file-list">
                ${result.files.map(f => `
                  <div class="file-item">
                    ${f.isDirectory ? '📁' : '📄'} ${f.name}
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      } else {
        displayResult(result);
      }

      document.getElementById('resultContainer').style.display = 'block';
      displayLogs(result.logs);
    }

    /**
     * Verificar disponibilidad del servidor al cargar
     */
    window.addEventListener('load', async () => {
      const health = await smbClient.checkHealth();
      if (!health.available) {
        const resultBox = document.getElementById('resultBox');
        resultBox.innerHTML = `
          <div class="result-box result-error">
            <div class="result-title">⚠ Servidor no disponible</div>
            <div class="result-content">
              No se pudo conectar al servidor backend en ${smbClient.baseURL}
              <br><br>
              <strong>Asegúrate de que:</strong>
              <ul style="margin: 8px 0; padding-left: 20px;">
                <li>El servidor Node.js está corriendo</li>
                <li>Ejecuta: <code>npm install && npm start</code></li>
                <li>El servidor está en puerto 3000</li>
              </ul>
            </div>
          </div>
        `;
        document.getElementById('resultContainer').style.display = 'block';
      }
    });
  </script>
</body>
</html>
